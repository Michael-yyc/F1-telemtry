[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "f1-telemetry-analyser"
version = "0.1.0"
description = "Distance-aligned F1 lap comparisons with explicit data-quality checks"
requires-python = ">=3.11"
dependencies = ["fastf1==3.9.0", "numpy>=2,<3", "pandas>=2.2,<3", "plotly>=6,<7", "streamlit>=1.45,<2", "requests>=2.30,<3", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "nbformat>=5,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
